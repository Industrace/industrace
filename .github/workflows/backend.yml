name: Backend CI

on: [push, pull_request]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
      - name: Run tests with coverage gate (critical modules)
        env:
          DATABASE_URL: "sqlite:///:memory:"
          SECRET_KEY: test-secret-key
          PYTHONPATH: ${{ github.workspace }}/backend
          ENVIRONMENT: development
          REDIS_ENABLED: "false"
        run: |
          cd backend
          pytest tests/ \
            --cov=app \
            --cov-config=.coveragerc \
            --cov-report=term-missing \
            -q

  probe-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install probe dependencies
        run: pip install -r probe/requirements.probe.txt pytest
      - name: Run probe unit tests
        env:
          PYTHONPATH: ${{ github.workspace }}/probe
        run: pytest probe/tests/ -q
